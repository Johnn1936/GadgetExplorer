name: dotnet

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore tests/GadgetExplorer.Tests/GadgetExplorer.Tests.csproj

      - name: Test
        run: dotnet test tests/GadgetExplorer.Tests/GadgetExplorer.Tests.csproj --no-restore -v minimal
